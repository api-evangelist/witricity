aid: witricity
name: WiTricity
description: 'WiTricity AI Tech, LLC is a wireless power transfer company founded on
  the highly resonant magnetic-resonance research published by an MIT team led by Marin
  Soljacic in 2007. The company holds the foundational patent portfolio for wireless
  power transfer over distance and commercializes it by licensing intellectual property,
  reference designs and engineering services to automakers, Tier 1 suppliers and charging
  hardware manufacturers rather than by selling software. Its product surface is hardware
  and IP: the MR/1 charging system, light-, medium- and heavy-duty EV wireless charging,
  smart-city and transit infrastructure, autonomous-vehicle and ground-support-equipment
  fleets, and bidirectional V2G energy arbitrage. WiTricity chairs several SAE J2954
  working groups, the interoperability standard for wireless EV and PHEV charging.
  As of a probe on 2026-09-04 the company publishes no developer program, no API
  documentation, no machine-readable contract and no public code repositories; its
  integration story is delivered through licensee engineering support, not a public
  API.'
